services:
  - type: web
    name: meta-upload-pipeline
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    plan: free
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: META_CAPI_TOKEN
        sync: false
      - key: META_CAPI_TEST_CODE
        sync: false
      - key: WC_WEBHOOK_SECRET
        sync: false
      - key: WC_SHOP_URL
        value: https://terrapretawein.de
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: DATA_DIR
        value: /tmp
      - key: PYTHON_VERSION
        value: "3.11.0"
